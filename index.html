<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03241b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="beFanta">
<title>beFanta</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="stylesheet" href="assets/style.css?v=28eb7f3f8c">
<script src="assets/app.js?v=8369b79e10" defer></script>
</head>
<body>
<div class="wrap">
  <div class="topbar"><header class="top gutter">
    <a class="logo-mark" href="#squadre" aria-label="beFanta">
      <b>beFanta</b>
    </a>
    <nav class="nav glass" aria-label="Sezioni">
      <a href="#squadre" class="on" id="navTeams">Squadre</a>
      <a href="#lista" id="navList">Lista bonus</a>
    </nav>
    <button class="pill-dark" id="reset" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Azzera voti
    </button>
  </header></div>

  <section class="hero gutter">
    <h1>Bonus <span>difesa</span></h1>
  </section>

  <main class="main gutter">

    <div class="teams" id="squadre"></div>

    <aside class="side" id="lista">
      <section class="panel glass" aria-labelledby="listTitle">
        <div class="panel-top"><h2 id="listTitle">Lista bonus</h2><small id="today"></small></div>
        <ul class="list" id="list"></ul>
        <div class="panel-foot">
          <div class="meter"><span id="count">0 di 8 squadre</span><span id="pct">0%</span></div>
          <div class="bar"><i id="barFill"></i></div>
          <button class="cta" id="download" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Scarica immagine
          </button>
          <button class="sec" id="copy" type="button">Copia come testo</button>
          <textarea id="copyArea" readonly hidden aria-label="Testo della lista"></textarea>
        </div>
      </section>
    </aside>
  </main>
  <footer class="gutter">beFanta · i voti restano salvati su questo dispositivo.</footer>
</div>

<div class="overlay" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="dialog">
    <h3 id="cTitle">Azzerare i voti?</h3>
    <p>Verranno cancellati i voti di tutte le squadre. L'operazione non si può annullare.</p>
    <div class="row"><button class="btn" id="cNo" type="button">Annulla</button><button class="btn red" id="cYes" type="button">Azzera voti</button></div>
  </div>
</div>
<div class="overlay" id="imgModal" hidden role="dialog" aria-modal="true" aria-labelledby="iTitle">
  <div class="dialog">
    <h3 id="iTitle">Immagine pronta</h3>
    <img id="iPrev" alt="Lista bonus difesa">
    <button class="cta" id="iShare" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Condividi o salva
    </button>
    <button class="cta" id="iSave" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Salva immagine
    </button>
    <p class="hint" id="iHint"></p>
    <button class="btn" id="iClose" type="button">Chiudi</button>
  </div>
</div>
</body>
</html>
